<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 462" width="1200" height="462" role="img" aria-label="Legacy AUTOSAR C source and ARXML turned into a detailed design: software component with ports, runnables with timing and a state machine">
  <title>swdd-recon – legacy AUTOSAR C code and ARXML to Software Detailed Design</title>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; }
      .fg   { fill: #e6edf3; }
      .mut  { fill: #8b949e; }
      .kw   { fill: #ff7b72; }
      .mac  { fill: #ffa657; }
      .fn   { fill: #d2a8ff; }
      .cst  { fill: #79c0ff; }
      .tag  { fill: #7ee787; }
      .amb  { fill: #e3b341; }
      .blu  { fill: #58a6ff; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .node  { fill: #0d1117; stroke: #58a6ff; stroke-width: 1.4; }
      .edge  { fill: none; stroke: #8b949e; stroke-width: 1.4; }
    </style>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#21262d"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8957e5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8957e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b949e"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e3b341"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc8cff"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1200" height="462" rx="18" fill="#0d1117"/>
  <rect width="1200" height="462" rx="18" fill="url(#dots)"/>

  <!-- title -->
  <text x="60" y="82" class="sans fg" font-size="42" font-weight="700" letter-spacing="-0.5">swdd-recon</text>
  <text x="60" y="112" class="sans mut" font-size="17">Reconstruct Software Detailed Design from legacy AUTOSAR C code</text>

  <!-- tags -->
  <g class="sans" font-size="12">
    <rect x="757" y="58" width="104" height="26" rx="13" fill="none" stroke="#30363d"/>
    <text x="809" y="75" class="mut" text-anchor="middle">AUTOSAR 4.x</text>
    <rect x="869" y="58" width="112" height="26" rx="13" fill="none" stroke="#30363d"/>
    <text x="925" y="75" class="mut" text-anchor="middle">ASPICE SWE.3</text>
    <rect x="989" y="58" width="151" height="26" rx="13" fill="none" stroke="#30363d"/>
    <text x="1064.5" y="75" class="mut" text-anchor="middle">Mermaid · PlantUML</text>
  </g>

  <!-- ===================== left top: C source ===================== -->
  <rect x="60" y="140" width="460" height="172" rx="10" class="panel"/>
  <line x1="61" y1="174" x2="519" y2="174" stroke="#30363d"/>
  <rect x="72" y="148" width="130" height="26" rx="6" fill="#0d1117"/>
  <text x="137" y="165" class="mono fg" font-size="12" text-anchor="middle">WiperCtrl_Sm.c</text>

  <rect x="61" y="283" width="458" height="20" fill="#e3b341" fill-opacity="0.13"/>
  <rect x="61" y="283" width="3" height="20" fill="#e3b341"/>

  <g class="mono" font-size="13" xml:space="preserve">
    <text x="92" y="197" class="mut" text-anchor="end">72</text>
    <text x="106" y="197" class="fg"><tspan class="mac">FUNC</tspan>(<tspan class="kw">void</tspan>, WiperCtrl_CODE) <tspan class="fn">WiperCtrl_Sm_Cyclic</tspan>(<tspan class="kw">void</tspan>)</text>
    <text x="92" y="217" class="mut" text-anchor="end">73</text>
    <text x="106" y="217" class="fg">{</text>
    <text x="92" y="237" class="mut" text-anchor="end">74</text>
    <text x="106" y="237" class="fg">  <tspan class="kw">switch</tspan> (WiperCtrl_State) {</text>
    <text x="92" y="257" class="mut" text-anchor="end">75</text>
    <text x="106" y="257" class="fg">    <tspan class="kw">case</tspan> <tspan class="cst">WIPER_ST_LOW</tspan>:</text>
    <text x="92" y="277" class="mut" text-anchor="end">76</text>
    <text x="106" y="277" class="fg">      <tspan class="kw">if</tspan> (enable == <tspan class="cst">FALSE</tspan>)</text>
    <text x="92" y="297" class="mut" text-anchor="end">77</text>
    <text x="106" y="297" class="fg">        WiperCtrl_State = <tspan class="cst">6u</tspan>;</text>
  </g>

  <!-- ===================== left bottom: ARXML ===================== -->
  <rect x="60" y="326" width="460" height="108" rx="10" class="panel"/>
  <line x1="61" y1="358" x2="519" y2="358" stroke="#30363d"/>
  <rect x="72" y="333" width="138" height="25" rx="6" fill="#0d1117"/>
  <text x="141" y="350" class="mono fg" font-size="12" text-anchor="middle">WiperCtrl.arxml</text>

  <rect x="61" y="402" width="458" height="19" fill="#58a6ff" fill-opacity="0.12"/>
  <rect x="61" y="402" width="3" height="19" fill="#58a6ff"/>

  <g class="mono" font-size="12.5" xml:space="preserve">
    <text x="92" y="378" class="mut" text-anchor="end">518</text>
    <text x="106" y="378" class="fg"><tspan class="tag">&lt;TIMING-EVENT&gt;</tspan></text>
    <text x="92" y="397" class="mut" text-anchor="end">519</text>
    <text x="106" y="397" class="fg">  <tspan class="tag">&lt;SHORT-NAME&gt;</tspan>EV_Main_10ms<tspan class="tag">&lt;/SHORT-NAME&gt;</tspan></text>
    <text x="92" y="416" class="mut" text-anchor="end">520</text>
    <text x="106" y="416" class="fg">  <tspan class="tag">&lt;PERIOD&gt;</tspan><tspan class="cst">0.01</tspan><tspan class="tag">&lt;/PERIOD&gt;</tspan></text>
  </g>

  <!-- ===================== flow: sources merge into design ===================== -->
  <ellipse cx="584" cy="300" rx="70" ry="70" fill="url(#glow)"/>
  <path d="M522,226 C556,226 556,300 576,300" fill="none" stroke="url(#flow)" stroke-width="1.6"/>
  <path d="M522,380 C556,380 556,300 576,300" fill="none" stroke="url(#flow)" stroke-width="1.6"/>
  <!-- sparkle -->
  <path d="M588,286 C589.5,296 591,298.5 601,300 C591,301.5 589.5,304 588,314 C586.5,304 585,301.5 575,300 C585,298.5 586.5,296 588,286 z" fill="#bc8cff"/>
  <path d="M603,282 C603.6,286 604,286.4 608,287 C604,287.6 603.6,288 603,292 C602.4,288 602,287.6 598,287 C602,286.4 602.4,286 603,282 z" fill="#d2a8ff" fill-opacity="0.8"/>
  <path d="M604,300 L636,300" fill="none" stroke="#bc8cff" stroke-width="1.6" marker-end="url(#arrP)"/>

  <!-- ===================== right: detailed design ===================== -->
  <rect x="640" y="140" width="500" height="294" rx="10" class="panel"/>
  <line x1="641" y1="174" x2="1139" y2="174" stroke="#30363d"/>
  <rect x="652" y="148" width="100" height="26" rx="6" fill="#0d1117"/>
  <text x="702" y="165" class="mono fg" font-size="12" text-anchor="middle">SWDD.md</text>
  <rect x="1060" y="151" width="68" height="20" rx="10" fill="none" stroke="#3fb950"/>
  <text x="1094" y="165" class="sans" font-size="11" fill="#3fb950" text-anchor="middle">mermaid</text>

  <!-- SWC with ports (AUTOSAR-style notation) -->
  <rect x="672" y="194" width="150" height="66" rx="3" class="node"/>
  <text x="747" y="216" class="sans mut" font-size="10.5" text-anchor="middle">SWC</text>
  <text x="747" y="238" class="sans fg" font-size="14" font-weight="600" text-anchor="middle">WiperCtrl</text>
  <g fill="#161b22" stroke="#58a6ff" stroke-width="1.2">
    <rect x="667" y="202" width="10" height="10"/>
    <rect x="667" y="219" width="10" height="10"/>
    <rect x="667" y="236" width="10" height="10"/>
    <rect x="817" y="210" width="10" height="10"/>
    <rect x="817" y="228" width="10" height="10"/>
  </g>
  <g fill="#58a6ff">
    <path d="M669.5,204.5 L674.5,207 L669.5,209.5 z"/>
    <path d="M669.5,221.5 L674.5,224 L669.5,226.5 z"/>
    <path d="M669.5,238.5 L674.5,241 L669.5,243.5 z"/>
    <path d="M819.5,212.5 L824.5,215 L819.5,217.5 z"/>
    <path d="M819.5,230.5 L824.5,233 L819.5,235.5 z"/>
  </g>

  <!-- runnables -->
  <rect x="856" y="215" width="268" height="20" rx="4" fill="#58a6ff" fill-opacity="0.12"/>
  <g class="mono" font-size="12">
    <text x="866" y="207" class="fn">RE_Init</text>
    <text x="1114" y="207" class="mut" text-anchor="end">init</text>
    <text x="866" y="229" class="fn">RE_Main</text>
    <text x="1114" y="229" class="blu" text-anchor="end">10 ms</text>
    <text x="866" y="251" class="fn">RE_Background</text>
    <text x="1114" y="251" class="mut" text-anchor="end">100 ms</text>
  </g>

  <line x1="656" y1="280" x2="1124" y2="280" stroke="#30363d" stroke-dasharray="3 4"/>

  <!-- state machine -->
  <circle cx="703" cy="298" r="4" fill="#e6edf3"/>
  <path d="M703,302 L703,315" class="edge" marker-end="url(#arr)"/>

  <rect x="672" y="318" width="62" height="30" rx="15" class="node"/>
  <text x="703" y="337" class="sans fg" font-size="12" text-anchor="middle">OFF</text>
  <rect x="812" y="318" width="62" height="30" rx="15" class="node"/>
  <text x="843" y="337" class="sans fg" font-size="12" text-anchor="middle">LOW</text>
  <rect x="990" y="318" width="92" height="30" rx="15" class="node" stroke="#e3b341"/>
  <text x="1036" y="337" class="sans fg" font-size="12" text-anchor="middle">PARKING</text>

  <path d="M735,333 L809,333" class="edge" marker-end="url(#arr)"/>
  <text x="772" y="326" class="sans mut" font-size="11" text-anchor="middle">stalk LOW</text>

  <path d="M875,333 L987,333" fill="none" stroke="#e3b341" stroke-width="1.6" marker-end="url(#arrA)"/>
  <text x="931" y="326" class="sans amb" font-size="11" text-anchor="middle">power off</text>

  <path d="M1036,349 C1036,394 703,394 703,352" class="edge" marker-end="url(#arr)"/>
  <text x="870" y="402" class="sans mut" font-size="11" text-anchor="middle">park position reached</text>
</svg>
